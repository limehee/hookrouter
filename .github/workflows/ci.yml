name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.1

      - name: Build and Test
        run: ./gradlew --no-daemon --configuration-cache check

      - name: API Compatibility Check
        if: matrix.java == '17'
        shell: bash
        run: |
          # Compare against the newest release, unless that release is the commit under test
          # (the release commit itself, whose artifacts may not be on Maven Central yet).
          HEAD_SHA=$(git rev-parse HEAD)
          BASELINE_TAG=""
          for TAG in $(git tag --list 'v*' --sort=-v:refname); do
            if [ "$(git rev-list -n 1 "${TAG}")" != "${HEAD_SHA}" ]; then
              BASELINE_TAG="${TAG}"
              break
            fi
          done
          if [ -z "${BASELINE_TAG}" ]; then
            echo "No release tag found. Skipping apiCompat."
            exit 0
          fi
          BASELINE_VERSION="${BASELINE_TAG#v}"
          echo "Using baseline version: ${BASELINE_VERSION}"
          ./gradlew --no-daemon --configuration-cache apiCompat -PapiBaselineVersion="${BASELINE_VERSION}"
